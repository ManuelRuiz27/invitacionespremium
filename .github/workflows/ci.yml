name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
      - 'chore/**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pilot-browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      DATABASE_POOL_MAX: 5
      AUTH_COOKIE_SECURE: 'false'
      AUTH_COOKIE_PATH: '/'
      AUTH_COOKIE_SAME_SITE: lax
      LOG_LEVEL: error
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 11.15.1
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Restore Turbo build and validation cache
        uses: actions/cache@v5
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-all-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-all-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec turbo run build --filter='@invitaciones/client^...'
      - run: pnpm --filter @invitaciones/api db:generate
      - run: pnpm exec playwright install --with-deps chromium
      - run: node --test scripts/qa-redaction.test.mjs
      - name: UX02 safe publication and current user instructions
        run: |
          pnpm access-control-guide:test
          pnpm access-control-guide:verify
          pnpm access-control-guide:render
      - name: M01 Managed and PHYSICAL_QR legacy in owned resources
        run: pnpm test:e2e:managed
      - name: ACCESS_CONTROL NOMINAL and ANONYMOUS in owned resources
        run: pnpm test:e2e:access-control
      - name: PR01 public catalog and PR02 managed commercial contracts in owned resources
        run: pnpm run test:e2e:public-catalog
      # No browser artifacts: single-delivery Staff/public credentials appear in these journeys.

  flipbook-browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Match @playwright/test exactly; avoid reinstalling WebKit's OS dependencies through APT.
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-noble
      options: --init --ipc=host
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 11.15.1
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Restore Turbo build and validation cache
        uses: actions/cache@v5
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-all-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-all-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm install --frozen-lockfile
      - name: Build Client workspace dependencies
        run: pnpm exec turbo run build --filter='@invitaciones/client^...'
      - run: pnpm exec playwright test -c playwright.flipbook.config.ts
      - name: Upload Flipbook visual evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui03b-flipbook-evidence
          path: |
            test-results/ui03b/
            playwright-report/ui03b/
          retention-days: 14

  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_ENV: test
      API_PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/invitacionespremium_test
      DATABASE_POOL_MAX: 5
      DATABASE_CONNECTION_TIMEOUT_MS: 5000
      DATABASE_IDLE_TIMEOUT_MS: 30000
      CORS_ORIGINS: http://localhost:5173
      LOG_LEVEL: error
      SWAGGER_ENABLED: 'true'

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: invitacionespremium_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d invitacionespremium_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.15.1

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Restore Turbo build and validation cache
        uses: actions/cache@v5
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-all-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-all-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Install dependencies
        id: install
        continue-on-error: true
        run: pnpm install --frozen-lockfile --reporter=append-only > pnpm-install.log 2>&1

      - name: Upload pnpm install log
        if: steps.install.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: pnpm-install-log
          path: pnpm-install.log
          retention-days: 3

      - name: Stop after install failure
        if: steps.install.outcome == 'failure'
        run: |
          tail -n 100 pnpm-install.log
          exit 1

      - name: Format check
        id: format
        continue-on-error: true
        run: pnpm format:check > prettier-check.log 2>&1

      - name: Generate Prettier patch
        if: steps.format.outcome == 'failure'
        run: |
          pnpm format
          git diff --binary -- . ':!pnpm-lock.yaml' > prettier.patch

      - name: Upload Prettier diagnostics
        if: steps.format.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: prettier-diagnostics
          path: |
            prettier-check.log
            prettier.patch
          retention-days: 3

      - name: Stop after format failure
        if: steps.format.outcome == 'failure'
        run: |
          cat prettier-check.log
          exit 1

      - name: Lint
        run: pnpm lint

      - name: Validate QA tooling and integration selection
        run: pnpm qa:tooling:test

      - name: Validate Prisma schema
        run: pnpm --filter @invitaciones/api db:validate

      - name: Apply Prisma migrations
        run: pnpm --filter @invitaciones/api db:migrate:deploy

      - name: Generate OpenAPI
        run: pnpm --filter @invitaciones/api openapi:generate

      - name: Check typed API client drift
        run: |
          pnpm --filter @invitaciones/api-client generate:check
          git diff --exit-code -- packages/api-client/src/generated/schema.ts

      - name: Verify API client routes
        run: pnpm --filter @invitaciones/api-client verify:openapi-routes

      - name: Typecheck
        id: typecheck
        continue-on-error: true
        run: pnpm typecheck > typecheck.log 2>&1

      - name: Upload typecheck diagnostics
        if: steps.typecheck.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: typecheck-diagnostics
          path: typecheck.log
          retention-days: 3

      - name: Stop after typecheck failure
        if: steps.typecheck.outcome == 'failure'
        run: |
          cat typecheck.log
          exit 1

      - name: Upload OpenAPI artifact
        uses: actions/upload-artifact@v7
        with:
          name: invitacionespremium-openapi
          path: apps/api/openapi/openapi.json
          retention-days: 7

      - name: Build
        run: pnpm build

  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: test
      LOG_LEVEL: error
      # Prisma config requires a URL even for generation. No database is started
      # or contacted by units; port 1 makes an accidental live dependency fail.
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:1/qa_unit_generation
    strategy:
      fail-fast: false
      matrix:
        # These suites share no processes, filesystem or mutable DB across runners.
        suite: [admin, client, other]
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 11.15.1
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Restore Turbo build and validation cache
        uses: actions/cache@v5
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ matrix.suite || 'all' }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ matrix.suite || 'all' }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm install --frozen-lockfile
      - name: Unit tests (always execute; dependency builds may hit cache)
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          case "$SUITE" in
            admin|client) pnpm exec turbo run test --concurrency=1 --filter="@invitaciones/$SUITE" ;;
            other) pnpm exec turbo run test --concurrency=1 --filter='!@invitaciones/admin' --filter='!@invitaciones/client' ;;
            *) exit 1 ;;
          esac

  api-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_ENV: test
      API_PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      DATABASE_POOL_MAX: 5
      DATABASE_CONNECTION_TIMEOUT_MS: 5000
      DATABASE_IDLE_TIMEOUT_MS: 30000
      CORS_ORIGINS: http://localhost:5173
      LOG_LEVEL: error
      SWAGGER_ENABLED: 'true'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 11.15.1
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: API integration tests (exclusive PostgreSQL runner)
        env:
          DT09_PERF_DIR: ${{ github.workspace }}/var/qa/perf01
          DT09_EXPLAIN: '1'
        # One owned DB, files serial, one worker. No other load during DT09.
        run: pnpm test:e2e:access-control -- --integration-only
      - name: Upload performance diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: perf01-performance
          path: var/qa/perf01/*.json
          if-no-files-found: ignore
          retention-days: 7

  # Preserve the historical required check name. Skips/cancellations also fail it.
  quality:
    if: always()
    needs: [checks, unit-tests, api-integration, pilot-browser-qa, flipbook-browser-qa]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every QA job to succeed
        env:
          QA_RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e 'const jobs = Object.entries(JSON.parse(process.env.QA_RESULTS)); for (const [name, job] of jobs) console.log(name + ": " + job.result); if (jobs.length !== 5 || jobs.some(([, job]) => job.result !== "success")) process.exit(1);'
