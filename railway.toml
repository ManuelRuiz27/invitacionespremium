[build]
builder = "railpack"
buildCommand = "corepack enable && pnpm install --frozen-lockfile && pnpm --filter @invitaciones/api build"

[deploy]
preDeployCommand = ["pnpm --filter @invitaciones/api db:migrate:deploy"]
startCommand = "pnpm --filter @invitaciones/api start"
healthcheckPath = "/api/v1/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
