services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: invitacionespremium
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d invitacionespremium']
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - invitacionespremium_postgres_data:/var/lib/postgresql/data

  workspace:
    build:
      context: .
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/invitacionespremium
      FILE_STORAGE_LOCAL_ROOT: /workspace/var/file-assets
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:5176}
      PUBLIC_INVITATION_BASE_URL: ${PUBLIC_INVITATION_BASE_URL:-http://localhost:5173/invitacion}
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3000/api/v1}
      VITE_SOCKET_URL: ${VITE_SOCKET_URL:-http://localhost:3000}
      VITE_ADMIN_APP_URL: ${VITE_ADMIN_APP_URL:-http://localhost:5174}
      VITE_CLIENT_APP_URL: ${VITE_CLIENT_APP_URL:-http://localhost:5173}
      VITE_SCANNER_APP_URL: ${VITE_SCANNER_APP_URL:-http://localhost:5175}
      VITE_LANDING_URL: ${VITE_LANDING_URL:-http://localhost:5176}
      VITE_APP_URL: ${VITE_APP_URL:-http://localhost:5176}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '3000:3000'
      - '5173:5173'
      - '5174:5174'
      - '5175:5175'
      - '5176:5176'
    healthcheck:
      test: ['CMD', 'node', 'scripts/smoke-local.mjs']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    volumes:
      - invitacionespremium_file_assets:/workspace/var/file-assets

volumes:
  invitacionespremium_postgres_data:
  invitacionespremium_file_assets:
